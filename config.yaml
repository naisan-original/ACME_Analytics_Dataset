# Every tunable parameter for the ACME dataset. Section numbers refer to ACME_DATASET_SPEC.md.
seed: 20261106

window:
  start_year: 2020
  start_month: 11
  months: 72

paths:
  company_sources: [sources/wikidata_listed_companies.csv, sources/us_listed_companies.csv]
  output_dir: output/lite
  dictionary: output/data_dictionary.md
  facilitator_dir: facilitator

synthetic_notice: "All commercial relationships, usage, and notes are fictional. Company names are used for realism only."

# Section 3
accounts:
  total: 15000
  region_counts: {US: 9000, Canada: 200, EMEA: 3200, APAC: 2000, LATAM: 600}
  band_counts: {"$50B+": 500, "$10-50B": 1500, "$2-10B": 3500, "$200M-2B": 9500}
  segment_by_band: {"$50B+": Strategic, "$10-50B": Strategic, "$2-10B": Enterprise, "$200M-2B": Upper Mid-Market}
  us_west_share: 0.35
  # Universe mix before customer selection weights are applied.
  industry_weights:
    High Tech: 0.20
    Financial Services: 0.13
    Healthcare & Life Sciences: 0.11
    Retail & CPG: 0.11
    Manufacturing: 0.14
    Energy & Utilities: 0.07
    Telecom & Media: 0.06
    Transportation & Logistics: 0.06
    Public Sector & Education: 0.04
    Professional Services: 0.08

# Section 4
