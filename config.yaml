  starting_customers: 25
  fy_end_customers: [120, 450, 1200, 2400, 3600, 4500]
  expected_annual_churn_by_fy: [0.06, 0.06, 0.06, 0.07, 0.09, 0.13]
  starting_customer_grower_share: 0.404
  high_tech_new_logo_share: [0.35, 0.28, 0.21, 0.16, 0.30, 0.12]
