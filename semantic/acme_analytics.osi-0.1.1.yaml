        dialects:
        - dialect: ANSI_SQL
          expression: ae_employee_id
      description: FK to dim_employee. Account Executive that month
      dimension:
        is_time: false
    - name: csm_employee_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: csm_employee_id
      description: FK to dim_employee. Customer Success Manager that month
      dimension:
        is_time: false
    - name: licensed_seats
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: licensed_seats
      description: Contracted seats
      dimension:
        is_time: false
      ai_context:
        synonyms:
        - seats
        - licenses
    - name: list_price_per_seat_month
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: list_price_per_seat_month
      description: List price per seat per month
      dimension:
        is_time: false
    - name: net_price_per_seat_month
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: net_price_per_seat_month
      description: Net price after volume discount
      dimension:
        is_time: false
    - name: mrr
      expression:
        dialects:
