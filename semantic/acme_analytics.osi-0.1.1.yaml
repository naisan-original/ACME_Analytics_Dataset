  metrics:
  - name: arr
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(fct_account_product_month.arr)
    description: Annual recurring revenue (MRR x 12).
    ai_context:
      instructions: 'Month-end snapshot: filter to one month or group by month. Never add it up across months. For a fiscal
        year, use fiscal_year_end_arr. The latest month is 202610.'
      synonyms:
      - annual recurring revenue
      - revenue
      - run rate
  - name: mrr
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(fct_account_product_month.mrr)
    description: Monthly recurring revenue.
    ai_context:
      instructions: 'Month-end snapshot: filter to one month or group by month. Never add it up across months.'
      synonyms:
      - monthly recurring revenue
  - name: fiscal_year_end_arr
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(CASE WHEN fct_account_product_month.month_id % 100 = 10 THEN fct_account_product_month.arr END)
    description: ARR in October, the last month of each fiscal year.
    ai_context:
      instructions: Group by dim_month.fiscal_year to get ARR at each year end.
      synonyms:
      - ending ARR
      - year-end ARR
      - closing ARR
  - name: fiscal_quarter_end_arr
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(CASE WHEN fct_account_product_month.month_id % 100 IN (1, 4, 7, 10) THEN fct_account_product_month.arr
          END)
    description: ARR in the last month of each fiscal quarter.
    ai_context:
      instructions: Group by dim_month.fiscal_quarter.
      synonyms:
      - quarter-end ARR
  - name: paying_customers
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT CASE WHEN fct_account_product_month.arr > 0 THEN fct_account_product_month.account_id END)
    description: Accounts with ARR above zero.
    ai_context:
      instructions: 'Month-end snapshot: filter to one month or group by month. Never add it up across months. Use fiscal_year_end_customers
        for fiscal years.'
      synonyms:
      - customers
      - customer count
      - logos
      - active customers
  - name: fiscal_year_end_customers
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT CASE WHEN fct_account_product_month.month_id % 100 = 10 AND fct_account_product_month.arr
          > 0 THEN fct_account_product_month.account_id END)
    description: Paying customers in October, the last month of each fiscal year.
    ai_context:
      instructions: Group by dim_month.fiscal_year.
      synonyms:
      - year-end customers
      - ending logos
  - name: licensed_seats
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(fct_account_product_month.licensed_seats)
    description: Contracted seats.
    ai_context:
      instructions: 'Month-end snapshot: filter to one month or group by month. Never add it up across months.'
      synonyms:
      - seats
      - licenses
  - name: active_users
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(fct_account_product_month.active_users)
    description: Users with at least one UI session. A person using two products counts once per product.
    ai_context:
      instructions: 'Month-end snapshot: filter to one month or group by month. Never add it up across months.'
      synonyms:
      - MAU
      - monthly active users
  - name: ui_hours
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(fct_account_product_month.ui_hours)
    description: Hours spent in the product UI.
    ai_context:
      synonyms:
      - UI time
      - hours
  - name: ui_sessions
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(fct_account_product_month.ui_sessions)
    description: UI sessions.
    ai_context:
      synonyms:
      - sessions
      - logins
  - name: api_calls
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(fct_account_product_month.api_calls)
    description: API requests.
    ai_context:
      synonyms:
      - API requests
      - API volume
  - name: work_units
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(fct_account_product_month.work_units)
    description: Product-specific activity; dim_product.work_unit_label says what each product counts.
    ai_context:
      instructions: Compare work units within one product; units differ between products.
      synonyms:
      - activity
      - usage
  - name: api_share
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(fct_account_product_month.api_share * fct_account_product_month.work_units) / NULLIF(SUM(fct_account_product_month.work_units),
          0)
    description: Share of work done through the API, weighted by work units. 0 to 1.
    ai_context:
      instructions: Use this weighted metric rather than averaging the api_share column.
      synonyms:
      - API share
      - programmatic share
  - name: average_discount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: 1 - SUM(fct_account_product_month.net_price_per_seat_month * fct_account_product_month.licensed_seats)
          / NULLIF(SUM(fct_account_product_month.list_price_per_seat_month * fct_account_product_month.licensed_seats), 0)
    description: Seat-weighted discount from list price. 0 to 1.
    ai_context:
      synonyms:
      - discount
      - price realization gap
  - name: product_churns
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(fct_account_product_month.churn_flag)
    description: Product subscriptions that ended.
    ai_context:
      instructions: Counts product subscriptions, not accounts. An account churns fully when all its products have ended.
      synonyms:
      - churn events
      - lost subscriptions
  - name: renewals_due
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(fct_account_product_month.renewal_month_flag)
    description: Account-product months in which a renewal falls.
    ai_context:
      synonyms:
      - renewals
  - name: estimated_users
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(user_usage_month.sample_weight)
    description: Estimated number of users in the full population, from the weighted sample.
    ai_context:
      instructions: 'Per month: filter to one month or group by month. A person using two products counts once per product.'
      synonyms:
      - users
      - user count
  - name: estimated_ui_hours
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(user_usage_month.ui_hours * user_usage_month.sample_weight)
    description: Estimated full-population UI hours from the weighted user sample.
  - name: estimated_api_calls
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(user_usage_month.api_calls * user_usage_month.sample_weight)
    description: Estimated full-population API calls from the weighted user sample.
  - name: sampled_users
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT user_usage_month.user_id)
    description: Distinct users in the sample. Not a population count.
    ai_context:
      instructions: Use estimated_users for population counts.
  - name: contract_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(contracts.contract_id)
    description: Contracts.
    ai_context:
      synonyms:
      - deals
      - bookings count
  - name: booked_acv
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(contracts.acv)
    description: Annual contract value of contracts, by start month.
    ai_context:
      instructions: This is bookings, not ARR. Use the arr metric for recurring revenue.
      synonyms:
      - bookings
      - ACV
  - name: touchpoint_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(touchpoints.touchpoint_id)
    description: Logged interactions.
    ai_context:
      synonyms:
      - interactions
      - activities
      - touches
  - name: average_sentiment
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(touchpoints.sentiment)
    description: Average touchpoint sentiment, from -2 to +2.
    ai_context:
      synonyms:
      - sentiment
      - customer sentiment
  - name: touched_accounts
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT touchpoints.account_id)
    description: Accounts with at least one logged interaction, including prospects.
  - name: account_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT dim_account.account_id)
    description: Accounts of every status, including prospects.
    ai_context:
      instructions: Use paying_customers to count customers.
      synonyms:
      - accounts
  - name: employee_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT dim_employee.employee_id)
    description: Sales and customer success staff, including leavers.
    ai_context:
      synonyms:
      - headcount
      - reps
